services:
  chromium:
    build: .
    container_name: chromium-debug
    hostname: chromium-debug
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PIXELFLUX_WAYLAND=false
      - CHROME_CLI=--remote-debugging-port=9222 --user-data-dir=/config/chrome-profile --no-first-run --no-default-browser-check about:blank
    labels:
      # Offered as "chromium-debug" in lan-terminal's pane menu, shown through port 3000.
      - lan-terminal.pane=chromium-debug
    volumes:
      - ./config:/config
    ports:
      - 127.0.0.1:3010:3000
      - 127.0.0.1:3011:3001
      - 127.0.0.1:9223:9223
    # Lets the browser reach host services (e.g. Restreamer on :8080) by name.
    extra_hosts:
      - host.docker.internal:host-gateway
    shm_size: "1gb"
    restart: unless-stopped
